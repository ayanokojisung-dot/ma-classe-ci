name: CI Ma Classe
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.12]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: python -m py_compile moyenne.py serveur.py
      - name: Tests
        run: python -m unitest -v
