name: CI Ma Classe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TITRE: "Ma Classe"

jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (syntaxe)
        run: python -m py_compile moyenne.py serveur.py
      - name: Tests
        run: python -m unittest -v
      - name: Utiliser un secret (jamais en clair)
        env:
          MON_SECRET: ${{ secrets.MON_SECRET }}
        run: |
          if [ -z "$MON_SECRET" ]; then echo "Secret absent"; else echo "Secret present (valeur masquee)"; fi
